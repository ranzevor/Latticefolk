name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check
        run: npm run check

  playable-e2e:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [A, B]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playable browser smoke
        run: node scripts/run-e2e-group.mjs ${{ matrix.group }}
      - name: Upload playable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-e2e-${{ github.run_id }}-${{ matrix.group }}
          if-no-files-found: warn
          path: |
            test-results/
            playwright-report/
          retention-days: 14
